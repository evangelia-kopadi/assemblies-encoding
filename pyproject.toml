[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assemblies-encoding"
version = "0.1.0"
description = "Causal structure preservation experiments for neural assemblies under encoding uncertainty."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0,<4.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "networkx>=2.6.0",
    "scikit-learn>=1.4.0",
    "causal-learn>=0.1.3.3",
    "statsmodels>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]
namespaces = true
